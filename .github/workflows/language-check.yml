name: CI / Documentation language

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  language:
    name: Documentation language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-base
          path: ecosystem-root
      - name: Validate Markdown language
        run: |
          python3 ecosystem-root/scripts/quality/check-language.py --all --mode markdown
          python3 ecosystem-root/scripts/quality/check-language.py --all --mode comments
          python3 ecosystem-root/scripts/quality/check-language.py --all --mode user-facing --report
