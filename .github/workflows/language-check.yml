name: CI / Documentation language

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".github/workflows/language-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-base
          path: ecosystem-root
      - name: Validate Markdown language
        run: |
          python3 ecosystem-root/scripts/check-language.py --all --mode comments
          python3 ecosystem-root/scripts/check-language.py --all --mode user-facing --report
