name: CI / Validate GCP PDF import contract

on:
  workflow_dispatch:
    inputs:
      pf_svc_income_url:
        description: "pf-svc-income HTTPS base URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pdf-validation:
    name: GCP PDF preview and JSON validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate synthetic PDF
        run: python3 scripts/generate-synthetic-payroll-pdf.py --output "$RUNNER_TEMP/synthetic-payroll.pdf"

      - name: Preview PDF and validate JSON import
        env:
          SERVICE_URL: ${{ inputs.pf_svc_income_url }}
          API_KEY: ${{ secrets.PF_SVC_INCOME_API_KEY_GCP }}
        run: |
          set -euo pipefail
          test -n "$API_KEY"
          preview_status=$(curl --fail --silent --show-error --max-time 60 \
            --output "$RUNNER_TEMP/preview.json" --write-out '%{http_code}' \
            -X POST "${SERVICE_URL%/}/payroll/pdf-preview" \
            -H "X-Api-Key: ${API_KEY}" \
            -F "files=@${RUNNER_TEMP}/synthetic-payroll.pdf;type=application/pdf")
          test "$preview_status" = 200
          python3 - "$RUNNER_TEMP/preview.json" "$RUNNER_TEMP/import.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          preview = json.loads(Path(sys.argv[1]).read_text())[0]
          assert preview["template_id"], "PDF preview did not resolve a template"
          assert len(preview["rows"]) == 3, "Synthetic PDF did not resolve three rows"
          assert all(row["concept_code"] for row in preview["rows"]), "Preview has unresolved rows"
          payload = {
              "mode": "validate",
              "periods": [{
                  "employer": preview["employer"],
                  "period_year": preview["period_year"],
                  "period_month": preview["period_month"],
                  "payment_date": preview["payment_date"],
                  "worked_days": preview["worked_days"],
                  "declared_net_pay_clp": preview["declared_net_pay_clp"],
                  "rows": [
                      {"concept_code": row["concept_code"], "amount_clp": row["amount_clp"]}
                      for row in preview["rows"]
                  ],
              }],
          }
          Path(sys.argv[2]).write_text(json.dumps(payload))
          print(f"preview template={preview['template_id']} rows={len(preview['rows'])}")
          PY
          import_status=$(curl --fail --silent --show-error --max-time 90 \
            --output "$RUNNER_TEMP/import-response.json" --write-out '%{http_code}' \
            -X POST "${SERVICE_URL%/}/payroll/import/json" \
            -H "X-Api-Key: ${API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/import.json")
          test "$import_status" = 200
          python3 - "$RUNNER_TEMP/import-response.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          body = json.loads(Path(sys.argv[1]).read_text())
          assert body["validated"] is True
          assert body["saved"] is None
          print(f"validated={body['validated']} saved={body['saved']} items={body['item_count']}")
          PY
