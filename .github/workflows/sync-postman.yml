# ============================================================
# pf-postman — Postman collection + environment sync
# ============================================================
#
# Pushes the collection and environments in this repository to a real Postman
# workspace whenever they change on main. One-way sync (repo → Postman); see
# README.md for the full rationale and one-time setup steps.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   POSTMAN_API_KEY          — generated in Postman → Settings → API keys
#   POSTMAN_COLLECTION_UID   — target collection's UID
#   POSTMAN_ENV_UID_LOCAL    — LOCAL environment's UID
#   POSTMAN_ENV_UID_GCP      — GCP environment's UID
#   PF_RATES_API_KEY_LOCAL   — pf-rates dev API key (injected into LOCAL env)
#   PF_PAYROLL_API_KEY_LOCAL — pf-payroll dev API key (injected into LOCAL env)
#   PF_RATES_API_KEY_GCP     — pf-rates production API key (injected into GCP env)
#   PF_PAYROLL_API_KEY_GCP   — pf-payroll production API key (injected into GCP env)
#   PF_SHEETS_API_KEY        — pf-sheets GET_CLP_API_KEY Script Property
#                              (injected into the collection's own variable --
#                              pf-sheets has no local/gcp split, single deployment)
#
# The environment JSON files and the collection's own "variable" block always
# carry EMPTY values for every api-key entry -- the real values live only as
# GitHub Secrets and are injected into a throwaway /tmp copy at sync time, by
# variable key name (never blind text substitution), then that copy is
# deleted. They never touch the repo or git history.
#
# ============================================================

name: CI / Sync Postman Collection

on:
  push:
    branches: [main]
    paths:
      - "pf-ecosystem.postman_collection.json"
      - "pf-ecosystem.postman_environment.local.json"
      - "pf-ecosystem.postman_environment.gcp.json"
      - ".github/workflows/sync-postman.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Postman assets validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate collection JSON
        run: jq empty pf-ecosystem.postman_collection.json
      - name: Validate local environment JSON
        run: jq empty pf-ecosystem.postman_environment.local.json
      - name: Validate GCP environment JSON
        run: jq empty pf-ecosystem.postman_environment.gcp.json
      - name: Check whitespace errors in the push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --check "${BEFORE_SHA}" "${HEAD_SHA}"
          else
            git diff --check "${HEAD_SHA}^" "${HEAD_SHA}"
          fi

  sync-collection:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate collection is well-formed JSON
        run: jq empty pf-ecosystem.postman_collection.json

      - name: Push collection to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
          PF_SHEETS_API_KEY: ${{ secrets.PF_SHEETS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${POSTMAN_API_KEY}" ] || [ -z "${POSTMAN_COLLECTION_UID}" ]; then
            echo "::error::POSTMAN_API_KEY and/or POSTMAN_COLLECTION_UID secrets are not set." \
                 "See README.md for one-time setup steps." >&2
            exit 1
          fi

          # Refuse to sync with a blank api-key -- a missing secret must
          # fail loudly, never silently overwrite a real key already set in
          # Postman with an empty string (this happened once, see git log).
          if [ -z "${PF_SHEETS_API_KEY}" ]; then
            echo "::error::PF_SHEETS_API_KEY secret is not set or empty." \
                 "Refusing to push -- this would overwrite the real key already in Postman with a blank." >&2
            exit 1
          fi

          # Inject by variable key name, never by blind text substitution --
          # the committed collection's pf_sheets_api_key value is just an
          # empty string, no placeholder marker syntax to keep in sync.
          jq --arg sheets_key "${PF_SHEETS_API_KEY}" '
            (.variable[] | select(.key == "pf_sheets_api_key") | .value) = $sheets_key
          ' pf-ecosystem.postman_collection.json > /tmp/materialized-collection.json

          jq -n --slurpfile collection /tmp/materialized-collection.json \
            '{collection: $collection[0]}' > /tmp/payload.json
          rm -f /tmp/materialized-collection.json

          http_status=$(curl --silent --show-error --output /tmp/response.json --write-out "%{http_code}" \
            -X PUT "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_UID}" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json)
          rm -f /tmp/payload.json

          cat /tmp/response.json
          if [ "${http_status}" -ge 300 ]; then
            echo "::error::Postman API returned HTTP ${http_status}" >&2
            exit 1
          fi
          echo "Synced OK (HTTP ${http_status})."

  sync-environments:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LOCAL
            file: pf-ecosystem.postman_environment.local.json
            env_uid_secret: POSTMAN_ENV_UID_LOCAL
            rates_key_secret: PF_RATES_API_KEY_LOCAL
            payroll_key_secret: PF_PAYROLL_API_KEY_LOCAL
          - name: GCP
            file: pf-ecosystem.postman_environment.gcp.json
            env_uid_secret: POSTMAN_ENV_UID_GCP
            rates_key_secret: PF_RATES_API_KEY_GCP
            payroll_key_secret: PF_PAYROLL_API_KEY_GCP
    steps:
      - uses: actions/checkout@v7

      - name: Validate ${{ matrix.name }} environment is well-formed JSON
        run: jq empty "${{ matrix.file }}"

      - name: Inject secrets and push ${{ matrix.name }} environment to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          ENV_UID: ${{ secrets[matrix.env_uid_secret] }}
          RATES_API_KEY: ${{ secrets[matrix.rates_key_secret] }}
          PAYROLL_API_KEY: ${{ secrets[matrix.payroll_key_secret] }}
        run: |
          set -euo pipefail

          if [ -z "${POSTMAN_API_KEY}" ] || [ -z "${ENV_UID}" ]; then
            echo "::error::POSTMAN_API_KEY and/or ${{ matrix.env_uid_secret }} secrets are not set." \
                 "See README.md for one-time setup steps." >&2
            exit 1
          fi

          # Refuse to sync with a blank api-key -- a missing secret must
          # fail loudly, never silently overwrite a real key already set in
          # Postman with an empty string (this happened once, see git log).
          if [ -z "${RATES_API_KEY}" ] || [ -z "${PAYROLL_API_KEY}" ]; then
            echo "::error::${{ matrix.rates_key_secret }} and/or ${{ matrix.payroll_key_secret }} secrets are not set or empty." \
                 "Refusing to push -- this would overwrite the real keys already in Postman with blanks." >&2
            exit 1
          fi

          # Inject by variable key name, never by blind text substitution --
          # the committed template's api-key values are just empty strings,
          # no placeholder marker syntax to keep in sync.
          jq --arg rates_key "${RATES_API_KEY}" --arg payroll_key "${PAYROLL_API_KEY}" '
            (.values[] | select(.key == "pf-rates-api-key") | .value) = $rates_key
            | (.values[] | select(.key == "pf-payroll-api-key") | .value) = $payroll_key
          ' "${{ matrix.file }}" > /tmp/materialized-environment.json

          jq -n --slurpfile environment /tmp/materialized-environment.json \
            '{environment: $environment[0]}' > /tmp/payload.json
          rm -f /tmp/materialized-environment.json

          http_status=$(curl --silent --show-error --output /tmp/response.json --write-out "%{http_code}" \
            -X PUT "https://api.getpostman.com/environments/${ENV_UID}" \
            -H "X-Api-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json)
          rm -f /tmp/payload.json

          cat /tmp/response.json
          if [ "${http_status}" -ge 300 ]; then
            echo "::error::Postman API returned HTTP ${http_status} for ${{ matrix.name }}" >&2
            exit 1
          fi
          echo "Synced ${{ matrix.name }} OK (HTTP ${http_status})."
