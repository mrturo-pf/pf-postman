name: CI / Validate Postman assets

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate collection JSON
        run: jq empty pf-ecosystem.postman_collection.json
      - name: Validate local environment JSON
        run: jq empty pf-ecosystem.postman_environment.local.json
      - name: Validate GCP environment JSON
        run: jq empty pf-ecosystem.postman_environment.gcp.json
      - name: Check whitespace errors in the change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git diff --check HEAD^ HEAD
          fi
