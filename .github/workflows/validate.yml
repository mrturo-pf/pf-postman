name: CI / Validate Postman assets

on:
  pull_request:
    paths:
      - "pf-ecosystem.postman_collection.json"
      - "pf-ecosystem.postman_environment.local.json"
      - "pf-ecosystem.postman_environment.gcp.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "pf-ecosystem.postman_collection.json"
      - "pf-ecosystem.postman_environment.local.json"
      - "pf-ecosystem.postman_environment.gcp.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Postman assets validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate collection JSON
        run: jq empty pf-ecosystem.postman_collection.json
      - name: Validate local environment JSON
        run: jq empty pf-ecosystem.postman_environment.local.json
      - name: Validate GCP environment JSON
        run: jq empty pf-ecosystem.postman_environment.gcp.json
      - name: Check whitespace errors in the push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --check "${BEFORE_SHA}" "${HEAD_SHA}"
          else
            git diff --check "${HEAD_SHA}^" "${HEAD_SHA}"
          fi
